name: C++ libraries

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 3

    steps:
      - uses: actions/checkout@v4
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake pkg-config libfontconfig1-dev libfreetype-dev \
            libgl1-mesa-dev libglfw3-dev libx11-dev libxext-dev libxrender-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build the libraries and tests
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build --output-on-failure
